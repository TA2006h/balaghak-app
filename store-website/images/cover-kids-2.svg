<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="كافر أطفال">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- جسم كافر الآيباد -->
  <g transform="translate(95 24)">
    <rect x="0" y="0" width="130" height="192" rx="16" fill="url(#g)"/>
    <rect x="0" y="0" width="130" height="192" rx="16" fill="url(#sheen)"/>
    <!-- بروز الكاميرا -->
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#000000" opacity="0.22"/>
    <circle cx="24" cy="24" r="5.5" fill="#000000" opacity="0.35"/>
    <circle cx="36" cy="34" r="3.5" fill="#000000" opacity="0.3"/>
    <!-- شعار دائري -->
    <circle cx="65" cy="120" r="26" fill="#ffffff" opacity="0.18"/>
    <circle cx="65" cy="120" r="14" fill="#ffffff" opacity="0.22"/>
  </g>
  <text x="160" y="228" text-anchor="middle" font-family="Cairo, Tajawal, sans-serif" font-size="15" font-weight="700" fill="#5a6360">كافر أطفال</text>
</svg>
